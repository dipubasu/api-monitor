<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Monitoring & Alert System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Intelligent API Monitoring & Alert System</h1>
    <button id="sendSampleBtn">Send Sample Data</button>
  </header>

  <section id="summaryCards" class="summary-cards">
    <div class="card">
      <span class="card-label">Total Active Alerts</span>
      <span class="card-value" id="totalCount">0</span>
    </div>
    <div class="card critical">
      <span class="card-label">Critical</span>
      <span class="card-value" id="criticalCount">0</span>
    </div>
    <div class="card high">
      <span class="card-label">High</span>
      <span class="card-value" id="highCount">0</span>
    </div>
    <div class="card medium">
      <span class="card-label">Medium</span>
      <span class="card-value" id="mediumCount">0</span>
    </div>
  </section>

  <main>
    <h2>Active Alerts</h2>
    <div id="alertList" class="alert-list">
      <p class="empty-state">Loading alerts...</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
